<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      Mis cupones
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="startCamera()">
        <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Selector de Pestañas con desplazamiento horizontal -->
  <ion-segment value="dulces" [scrollable]="true">
    <ion-segment-button value="dulces" content-id="dulces">
      <ion-label>Dulces</ion-label>
    </ion-segment-button>

    <ion-segment-button value="bebidas" content-id="bebidas">
      <ion-label>Bebidas</ion-label>
    </ion-segment-button>

    <ion-segment-button value="carnes" content-id="carnes">
      <ion-label>Carnes</ion-label>
    </ion-segment-button>

    <ion-segment-button value="congelados" content-id="congelados">
      <ion-label>Congelados</ion-label>
    </ion-segment-button>

    <ion-segment-button value="panaderia" content-id="panaderia">
      <ion-label>Panadería</ion-label>
    </ion-segment-button>

    <ion-segment-button value="frutas" content-id="frutas">
      <ion-label>Frutas y Verduras</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- Vistas de los segmentos -->
  <ion-segment-view>
    <ion-segment-content id="dulces">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'dulces' }"></ng-container>
    </ion-segment-content>

    <ion-segment-content id="bebidas">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'bebidas' }"></ng-container>
    </ion-segment-content>

    <ion-segment-content id="carnes">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'carnes' }"></ng-container>
    </ion-segment-content>

    <ion-segment-content id="congelados">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'congelados' }"></ng-container>
    </ion-segment-content>

    <ion-segment-content id="panaderia">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'panaderia' }"></ng-container>
    </ion-segment-content>

    <ion-segment-content id="frutas">
      <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{ category: 'frutas' }"></ng-container>
    </ion-segment-content>
  </ion-segment-view>

  <!-- Plantilla del Grid de Cupones -->
  <ng-template #couponTemplate let-categoria="category">
    <ion-grid>
      <ion-row>
        @for(coupon of coupons | filterCouponCategory: categoria; track coupon.idProduct) {
          <ion-col size="6">
            <ion-card class="rounded"
              [color]="coupon.active ? 'secondary' : 'light'"
              (click)="changeActive(coupon)">
              
              <div class="card-img-container">
                <img [src]="coupon.img" [alt]="coupon.name" />
              </div>

              <ion-card-header class="ion-text-center">
                <ion-card-subtitle>{{ coupon.name }}</ion-card-subtitle>
                <ion-card-title>{{ coupon.discount }}%</ion-card-title>
              </ion-card-header>
            </ion-card>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  </ng-template>

</ion-content>
